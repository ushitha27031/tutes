<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operating System Tute | ICT Revision</title>
<meta name="theme-color" content="#02081c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#02081c; --bg-mid:#0a1f55; --cyan:#2fc4ff; --cyan-soft:rgba(47,196,255,.35);
  --text:#f2f6fb; --muted:#9db6e0; --btn-bg:rgba(255,255,255,.08); --btn-line:rgba(47,196,255,.55);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg-deep:#02081c; --bg-mid:#0a1f55; } }
:root[data-theme="dark"]{ --bg-deep:#02081c; --bg-mid:#0a1f55; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; overflow:hidden; color:var(--text);
  font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(120% 80% at 50% 38%, var(--bg-mid) 0%, var(--bg-deep) 62%) , var(--bg-deep);
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;}
#particles{position:fixed; inset:0; width:100%; height:100%; pointer-events:none}
.leaf-glow{position:fixed; inset:auto -20% -30% -20%; height:60%; pointer-events:none;
  background:radial-gradient(50% 60% at 50% 100%, rgba(47,196,255,.22), transparent 70%)}

.app{position:relative; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(14px,3vh,28px); padding:16px}
.stage{perspective:1700px; perspective-origin:50% 40%; touch-action:none; cursor:grab; position:relative}
.stage:active{cursor:grabbing}
.floor{position:absolute; left:50%; bottom:calc(var(--h) * -0.06); width:calc(var(--w)*1.3); height:calc(var(--h)*.12);
  transform:translateX(-50%); border-radius:50%; background:radial-gradient(closest-side, rgba(47,196,255,.28), rgba(0,0,0,0));
  filter:blur(6px); opacity:0; transition:opacity 1.2s ease}
.ready .floor{opacity:1}
.book{position:relative; width:var(--w); height:var(--h); transform-style:preserve-3d; will-change:transform}
.face,.side{position:absolute; left:50%; top:50%; backface-visibility:hidden; -webkit-backface-visibility:hidden}
.face{width:var(--w); height:var(--h); margin:calc(var(--h)/-2) 0 0 calc(var(--w)/-2); overflow:hidden; border-radius:2px 6px 6px 2px;
  box-shadow:0 0 0 1px rgba(47,196,255,.18), 0 30px 60px rgba(0,0,0,.5)}
.face img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; pointer-events:none}
.front{transform:translateZ(calc(var(--t)/2))}
.back{transform:rotateY(180deg) translateZ(calc(var(--t)/2)); border-radius:6px 2px 2px 6px}
.spine{width:var(--t); height:var(--h); margin:calc(var(--h)/-2) 0 0 calc(var(--t)/-2);
  transform:rotateY(-90deg) translateZ(calc(var(--w)/2));
  background:linear-gradient(90deg,#02081c,#0a1f55 45%,#02081c); display:flex; align-items:center; justify-content:center}
.spine span{writing-mode:vertical-rl; transform:rotate(180deg); font-size:calc(var(--t)*.5); font-weight:700; letter-spacing:.08em; color:var(--cyan); white-space:nowrap}
.pages{width:var(--t); height:calc(var(--h) - 4px); margin:calc(var(--h)/-2 + 2px) 0 0 calc(var(--t)/-2);
  transform:rotateY(90deg) translateZ(calc(var(--w)/2 - 2px));
  background:repeating-linear-gradient(90deg,#eef3f1 0 1px,#c9d3d0 1px 2px)}
.top,.bottom{width:calc(var(--w) - 3px); height:var(--t); margin:calc(var(--t)/-2) 0 0 calc(var(--w)/-2 + 1px);
  background:repeating-linear-gradient(0deg,#eef3f1 0 1px,#c9d3d0 1px 2px)}
.top{transform:rotateX(90deg) translateZ(calc(var(--h)/2 - 1px))}
.bottom{transform:rotateX(-90deg) translateZ(calc(var(--h)/2 - 1px))}

/* Live overlays on the real artwork */
.hot{position:absolute; inset:0; pointer-events:none; opacity:0}
.ready .ready @keyframes neon{0%,100%{opacity:.0}4%{opacity:1}6%{opacity:.2}9%{opacity:1}40%{opacity:.85}70%{opacity:.35}}
@keyframes breathe{0%,100%{opacity:0}50%{opacity:1}}
  background:linear-gradient(90deg,transparent,var(--cyan),transparent); box-shadow:0 0 14px 3px var(--cyan-soft)}
.ready .shine{position:absolute; inset:-10%; pointer-events:none; transform:translateX(-120%) skewX(-18deg);
  background:linear-gradient(90deg,transparent 35%,rgba(255,255,255,.28) 48%,rgba(160,255,255,.12) 52%,transparent 65%)}
.shine.go{animation:shine 1.4s ease-out forwards}
@keyframes shine{to{transform:translateX(120%) skewX(-18deg)}}

.caption{text-align:center; max-width:34ch; opacity:0; transform:translateY(8px); transition:opacity .9s ease, transform .9s ease}
.ready .caption{opacity:1; transform:none}
.caption h1{margin:0 0 4px; font-size:clamp(17px,4.4vw,22px); font-weight:800; letter-spacing:.01em}
.caption p{margin:0; font-size:clamp(12px,3.3vw,14px); color:var(--muted); font-weight:500}
.controls{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; opacity:0; transition:opacity .9s ease .3s}
.ready .controls{opacity:1}
.controls button,.controls a{font:inherit; font-size:14px; font-weight:700; color:var(--text); text-decoration:none;
  background:var(--btn-bg); border:1px solid var(--btn-line); border-radius:999px; padding:10px 18px; cursor:pointer;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:inline-flex; align-items:center; gap:8px}
.controls a.wa{background:#1fa855; border-color:#1fa855; color:#fff}
.controls :focus-visible{outline:2px solid var(--cyan); outline-offset:3px}
.hint{font-size:12px; color:var(--muted); opacity:0; transition:opacity 1s ease .8s}
.ready .hint{opacity:.8}
@media (prefers-reduced-motion: reduce){ .ready .title-glow,.ready .core-glow,.ready </style>
</head>

<script>
(function(){
  var root=document.documentElement, app=document.getElementById('app'), stage=document.getElementById('stage'), book=document.getElementById('book');
  var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function size(){
    var ratio=1.4205;
    var w=Math.min(window.innerWidth*0.78, (window.innerHeight*0.62)/ratio, 460);
    var h=w*ratio;
    root.style.setProperty('--w',w+'px'); root.style.setProperty('--h',h+'px'); root.style.setProperty('--t',Math.max(8,w*0.035)+'px');
  }
  size(); window.addEventListener('resize',size);

  // pose state
  var pose={ry:-200, rx:28, z:-1100, s:.5}, base=0, t0=performance.now(), tween=null, dragging=false, float=true;
  function ease(t){return 1-Math.pow(1-t,4)}
  function animateTo(target,dur,done){
    var from={ry:pose.ry,rx:pose.rx,z:pose.z,s:pose.s}, start=performance.now();
    tween={from:from,target:target,start:start,dur:dur,done:done};
  }
  function render(now){
    if(tween){
      var k=Math.min(1,(now-tween.start)/tween.dur), e=ease(k);
      for(var p in tween.target){ pose[p]=tween.from[p]+(tween.target[p]-tween.from[p])*e; }
      if(k>=1){ var d=tween.done; tween=null; if(d)d(); }
    }
    var tt=(now-t0)/1000, fy=0, fx=0, fl=0;
    if(float && !dragging && !reduce){ fy=Math.sin(tt*0.7)*7; fx=Math.sin(tt*0.9)*2.5; fl=Math.sin(tt*1.1)*6; }
    book.style.transform='translateY('+fl+'px) translateZ('+pose.z+'px) scale('+pose.s+') rotateX('+(pose.rx+fx)+'deg) rotateY('+(pose.ry+fy)+'deg)';
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  function shine(){
    var front=Math.round(((base%360)+360)%360)!==180;
    var el=document.getElementById(front?'shine':'shine2');
    el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  }
  var timers=[];
  function clearTimers(){timers.forEach(clearTimeout); timers=[];}
  function flip(){ base+=180; animateTo({ry:base-14,rx:6},1100,shine); }

  function intro(){
    clearTimers(); app.classList.remove('ready'); base=0;
    if(reduce){ pose={ry:-14,rx:6,z:0,s:1}; app.classList.add('ready'); return; }
    pose={ry:-200,rx:28,z:-1100,s:.5};
    animateTo({ry:-14,rx:6,z:0,s:1},2400,function(){ app.classList.add('ready'); shine(); });
    timers.push(setTimeout(flip,7000));
    timers.push(setTimeout(flip,11500));
  }
  intro();

  document.getElementById('flipBtn').addEventListener('click',function(){clearTimers(); flip();});
  document.getElementById('replayBtn').addEventListener('click',intro);

  // drag / tap
  var sx=0, sy=0, startRy=0, startRx=0, moved=false;
  stage.addEventListener('pointerdown',function(e){
    if(!app.classList.contains('ready'))return;
    dragging=true; moved=false; sx=e.clientX; sy=e.clientY; startRy=pose.ry; startRx=pose.rx; tween=null; clearTimers();
    try{stage.setPointerCapture(e.pointerId);}catch(_){}
  });
  stage.addEventListener('pointermove',function(e){
    if(!dragging)return;
    var dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>6)moved=true;
    pose.ry=startRy+dx*0.5; pose.rx=Math.max(-30,Math.min(30,startRx-dy*0.25));
  });
  function end(){
    if(!dragging)return; dragging=false;
    if(!moved){ flip(); return; }
    var snapped=Math.round((pose.ry+14)/180)*180; base=snapped;
    animateTo({ry:snapped-14,rx:6},700,shine);
  }
  stage.addEventListener('pointerup',end); stage.addEventListener('pointercancel',end);
  stage.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault(); clearTimers(); flip();} });
  stage.tabIndex=0;

  // particles: rising data specks
  var c=document.getElementById('particles'), ctx=c.getContext('2d'), P=[], dpr=Math.min(2,window.devicePixelRatio||1);
  function rs(){ c.width=innerWidth*dpr; c.height=innerHeight*dpr; }
  rs(); addEventListener('resize',rs);
  var n=reduce?0:Math.min(70,Math.round(innerWidth*innerHeight/14000));
  for(var i=0;i<n;i++)P.push({x:Math.random(),y:Math.random(),v:.0006+Math.random()*.0016,r:.6+Math.random()*1.8,a:.2+Math.random()*.6,sq:Math.random()<.3});
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    for(var i=0;i<P.length;i++){
      var p=P[i]; p.y-=p.v; if(p.y<-0.02){p.y=1.02;p.x=Math.random();}
      ctx.fillStyle='rgba(47,196,255,'+p.a*(0.4+0.6*Math.sin(p.y*3.14))+')';
      var x=p.x*c.width, y=p.y*c.height, r=p.r*dpr;
      if(p.sq)ctx.fillRect(x,y,r*1.6,r*1.6); else {ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill();}
    }
    if(n)requestAnimationFrame(draw);
  })();
})();
